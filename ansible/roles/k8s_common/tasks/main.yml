---
- name: Verify Tailscale interface exists on node
  ansible.builtin.assert:
    that:
      - "'tailscale0' in ansible_interfaces"
    fail_msg: "Interface 'tailscale0' not found on {{ inventory_hostname }} ({{ ansible_host }}). Please ensure Tailscale is active."
    success_msg: "Tailscale interface 'tailscale0' is verified on {{ inventory_hostname }}."

- name: Detect node Tailscale IP address
  ansible.builtin.set_fact:
    node_tailscale_ip: "{{ ansible_tailscale0.ipv4.address | default(ansible_host) }}"

- name: Display detected Tailscale IP
  ansible.builtin.debug:
    msg: "Node {{ inventory_hostname }} is using Tailscale IP: {{ node_tailscale_ip }}"

- name: Test network connectivity to K8s Server over Tailscale
  ansible.builtin.command:
    cmd: ping -c 2 -W 3 {{ k8s_server_host }}
  changed_when: false
  when: inventory_hostname in groups['worker_nodes']

- name: Disable swap immediately
  ansible.builtin.command: swapoff -a
  changed_when: false
  failed_when: false

- name: Disable swap permanently in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^(\s*[^#\n]+\s+swap\s+.*)$'
    replace: '# \1'

- name: Ensure kernel modules are loaded on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'
    content: |
      overlay
      br_netfilter

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Configure sysctl settings for Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
  loop:
    - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { name: 'net.ipv4.ip_forward', value: '1' }
