---
- name: Wait for all nodes to be Ready in Kubernetes
  ansible.builtin.shell: |
    /usr/local/bin/kubectl get nodes --no-headers | grep -v "Ready" || true
  register: node_check
  until: node_check.stdout == ""
  retries: 30
  delay: 10
  changed_when: false

- name: Wait for Traefik Ingress Controller to be ready
  ansible.builtin.shell: |
    /usr/local/bin/kubectl rollout status deployment/traefik -n kube-system --timeout=120s
  register: traefik_check
  until: traefik_check.rc == 0
  retries: 10
  delay: 10
  changed_when: false
  failed_when: false

- name: Create namespace for Argo CD
  ansible.builtin.shell: |
    /usr/local/bin/kubectl create namespace {{ argocd_namespace }} --dry-run=client -o yaml | /usr/local/bin/kubectl apply -f -
  register: argocd_ns
  changed_when: "'created' in argocd_ns.stdout"

- name: Download Argo CD manifests with retry
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    dest: /tmp/argocd-install.yaml
    mode: '0644'
  register: argocd_download
  until: argocd_download is not failed
  retries: 5
  delay: 5

- name: Deploy Argo CD manifests
  ansible.builtin.shell: |
    /usr/local/bin/kubectl apply -n {{ argocd_namespace }} --server-side --force-conflicts -f /tmp/argocd-install.yaml
  register: argocd_install
  changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout"

- name: Copy Argo CD root Application manifest
  ansible.builtin.template:
    src: application.yaml.j2
    dest: /tmp/argocd-root-app.yaml
    mode: '0644'

- name: Apply Argo CD Application to start GitOps synchronization
  ansible.builtin.shell: |
    /usr/local/bin/kubectl apply -n {{ argocd_namespace }} -f /tmp/argocd-root-app.yaml
  register: argocd_app_apply
  changed_when: "'created' in argocd_app_apply.stdout or 'configured' in argocd_app_apply.stdout"

- name: Wait for Argo CD admin secret to be generated
  ansible.builtin.shell: |
    /usr/local/bin/kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath="{.data.password}"
  register: argocd_password_raw
  until: argocd_password_raw.rc == 0 and argocd_password_raw.stdout != ""
  retries: 20
  delay: 6
  changed_when: false
  failed_when: false

- name: Get Kubernetes nodes list
  ansible.builtin.command: /usr/local/bin/kubectl get nodes -o wide
  register: k8s_nodes_list
  changed_when: false

- name: Display Cluster Setup Summary Banner
  ansible.builtin.debug:
    msg:
      - "===================================================================="
      - " 3-NODE KUBERNETES CLUSTER IS READY! (MANAGED VIA TAILSCALE)"
      - "===================================================================="
      - "{{ k8s_nodes_list.stdout_lines }}"
      - "--------------------------------------------------------------------"
      - " ARGO CD WEB UI: https://{{ k8s_server_host }}:8080 (or port-forward)"
      - " ARGO CD USER:   admin"
      - " ARGO CD PASS:   {{ (argocd_password_raw.stdout | b64decode) if argocd_password_raw.stdout is defined else 'Pending - check later' }}"
      - "--------------------------------------------------------------------"
      - " Local kubeconfig generated on your Mac: ./kubeconfig"
      - " You can now run on Mac: export KUBECONFIG=../kubeconfig && kubectl get nodes"
      - "===================================================================="
