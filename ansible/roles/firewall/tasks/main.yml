---
- name: INSTALL UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: yes
    cache_valid_time: 3600
    lock_timeout: 600

- name: ALLOW SPECIFIED PORTS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_allowed_ports }}"

- name: Allow all traffic on Tailscale interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in

- name: Set UFW default forward policy to ACCEPT for Kubernetes networking
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: Reload UFW

- name: Enable UFW with default deny incoming and allow outgoing
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
