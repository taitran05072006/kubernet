backend:
  enabled: true
  replicaCount: 2
  image:
    repository: taitran05072006/backend
    tag: a8bd3c3e351773035818cd07d039046ffaf6bf97 # backend-tag
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /api/health
      initialDelaySeconds: 40
      periodSeconds: 15
      timeoutSeconds: 5
    readiness:
      path: /api/health
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: taitran05072006/frontend
    tag: a8bd3c3e351773035818cd07d039046ffaf6bf97 # frontend-tag
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5

mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  database: ontap
  rootPassword: "baitaplon_root_password"
  storage:
    size: 5Gi
    accessMode: ReadWriteOnce
  service:
    type: ClusterIP
    port: 3306
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  paths:
    api: /api
    frontend: /
