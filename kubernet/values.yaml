# ==============================================================================
# VALUES.YAML - CONFIGURATION FOR 3-NODE CLUSTER (1 SERVER + 2 AGENTS)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BACKEND (Spring Boot Application)
# ------------------------------------------------------------------------------
backend:
  enabled: true
  replicaCount: 2
  image:
    repository: taitran05072006/backend
    tag: 2e535d83c3abd21b07a02b5a7354452c8ba6c01e # backend-tag
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /api/health
      initialDelaySeconds: 40
      periodSeconds: 15
      timeoutSeconds: 5
    readiness:
      path: /api/health
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 3

# ------------------------------------------------------------------------------
# 2. FRONTEND (React / Vite Application)
# ------------------------------------------------------------------------------
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: taitran05072006/frontend
    tag: 2e535d83c3abd21b07a02b5a7354452c8ba6c01e # frontend-tag
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5

# ------------------------------------------------------------------------------
# 3. MYSQL DATABASE
# ------------------------------------------------------------------------------
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  database: ontap
  rootPassword: "baitaplon_root_password"
  storage:
    size: 5Gi
    accessMode: ReadWriteOnce
  service:
    type: ClusterIP
    port: 3306
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ------------------------------------------------------------------------------
# 4. NGINX INGRESS CONTROLLER ROUTING
# ------------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  paths:
    api: /api
    frontend: /
