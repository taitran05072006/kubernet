{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "baitaplon.fullname" . }}-mysql-secret
  labels:
    {{- include "baitaplon.labels" . | nindent 4 }}
    app: mysql
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
{{- end }}
